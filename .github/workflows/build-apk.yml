name: Build Kisan Saathi APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      # Optional. If a repository secret named GEMINI_API_KEY exists, package it so the online
      # assistant works in this build. Without the secret the app uses Firebase, then offline answers.
      - name: Add Gemini API key from repository secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "Gemini API key added to the build."
          else
            echo "No GEMINI_API_KEY secret set; building without it."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to release folder
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/kisan-saathi-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kisan-saathi-debug-apk
          path: release/kisan-saathi-debug.apk

      - name: Commit APK to release folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/kisan-saathi-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build and update release/kisan-saathi-debug.apk [skip ci]"
            git push
          else
            echo "APK is already up to date."
          fi
